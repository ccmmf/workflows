run_dir: "ci-3-apptainer-rundir/"
start_date: "2016-01-01"
end_date: "2017-12-31"
run_LAI_date: "2016-07-01"
n_ens: 5
n_met: 3
n_ic: 20
n_event: 5
n_workers: 2
use_apptainer: true
pecan_parallelism_mode: slurm-sbatch
