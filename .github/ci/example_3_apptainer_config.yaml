    template_file: "examples/3_rowcrop/template.xml"
    site_info_file: ".github/ci/site_info_3.csv"
  link_in_place: {}

paths:
  fertilization_info_path: "data_raw/management/fertilization/v1.0/"
  ncc_info_path: "data_raw/management/ncc/v1.0/"
