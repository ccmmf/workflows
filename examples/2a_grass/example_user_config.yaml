# Example user-facing config for the 2a grass workflow.
# Run with:
#   ./magic-ensemble prepare-example-2a --config examples/2a_grass/example_user_config.yaml
#   ./magic-ensemble run-ensembles      --config examples/2a_grass/example_user_config.yaml
#
# This file contains only overridable settings and user-provided external
# resources. Fixed paths, S3 resources, and step I/O are defined in
# workflow_manifest.yaml and are not overridden here.

# Run directory: where outputs and run-specific data live.
# Relative to the CWD where you invoke the CLI, unless you use an absolute path.
run_dir: "example-2a-run-directory/"

# Dates used by prepare and run-ensembles.
start_date: "2016-01-01"
end_date: "2023-12-31"
run_LAI_date: "2016-07-01"

# Ensemble sizes.
n_ens: 20
n_met: 10
ic_ensemble_size: 100

# User-provided external resources.

# Absolute paths are used as-is; relative paths are resolved from the
# directory where you invoke ./magic-ensemble.
# paths in external_paths will be localized to the run_dir before the workflow is run.
external_paths:
    template_file: "examples/2a_grass/template.xml"
    site_info_file: ".github/ci/site_info_2a.csv"

# Parallelism (e.g. for step 01 --n_cores).
#  site_info_file: ".github/ci/site_info_2a.csv"
n_workers: 1

# Run prepare steps inside Apptainer (single image from workflow manifest; pull-if-not-present).
# When true: 'module load apptainer' is attempted, then apptainer must be on PATH; SIF is
# pulled from manifest remote if not present. No user override of remote; local image only.
use_apptainer: false

# Switch dispatch method for parallel execution (local-gnu-parallel, slurm-sbatch, etc.).
pecan_parallelism_mode: slurm-sbatch
# sbatch_additional_arguments: ""  # Extra flags for every sbatch call (ensemble-member submission), e.g. "-p node --account=foo".

# Steps the manifest marks eligible for srun-wrapping run under srun
# automatically when workflow_parallelism_mode is slurm-srun (the default);
# set to local to force every step to run unwrapped (does not affect
# pecan_parallelism_mode: slurm-sbatch above).
workflow_parallelism_mode: slurm-srun
# --mem=0 requests all memory on the allocated node (documented Slurm
# behavior, not "unlimited") -- default here to avoid OOM on steps like
# build-ic; add "-p <partition>" here too if your cluster needs one (no
# separate slurm_partition key -- it's just another srun flag).
srun_additional_arguments: "--mem=0"

# AWS CLI named profile for S3 access (get-demo-data command).
aws_profile: magic
