# Path definitions: all contained within the run directory.
# note that these paths are the internal-workflow expected I/O paths.
# Users should not modify these values unless you know what you are doing.
# Values are relative to run_dir; CLI resolves as run_dir + "/" + value.
paths:
    site_info_file: "site_info.csv"
    site_sipnet_met_path: "data/ERA5_SIPNET"
    site_era5_path: "data_raw/ERA5_CA_nc"
    field_shape_path: "data_raw/management/crops/v4.1/parcels-consolidated.gpkg"
    data_dir: "data/IC_prep"
    ic_outdir: "IC_files"
    pft_dir: "data_raw/pfts"
    ex1_and_2_pfts_dir: "pfts"
    landtrendr_raw_files: "data_raw/ca_biomassfiaald_2016_median.tif,data_raw/ca_biomassfiaald_2016_stdv.tif"
    template_file: "template.xml"
    output_file: "settings.xml"
    output_dir: "output"
    met_dir: "data/ERA5_SIPNET"
    ic_dir: "IC_files"
    settings_xml: "settings.xml"
    config_xml: "output/pecan.CONFIGS.xml"
    raw_parquet_dir: "data_raw/management"
    clean_parquet_dir: "data/management_ensembles"
    event_dir: "data/events"

# Fixed workflow values (not user overrides)
params_read_from_pft: "SLA,leafC,leafGrowth"
additional_params: "varname=wood_carbon_fraction,distn=norm,parama=0.48,paramb=0.005"
parallel_strategy: "multisession"

# Defaults that the user really _should_ set in their config,
# provided here as fallbacks
run_dir: "magic-ensemble-run-directory"
start_date: "2016-01-01"
end_date: "2023-12-31"
run_LAI_date: "2016-07-01"
n_ens: 20
n_met: 10
n_ic: 100
ic_ensemble_size: 100
n_event: 20
n_workers: 1
use_apptainer: "false"



# S3 resources (not in user config). Remote resources are localized before R runs.
# Stored as endpoint + bucket + per-resource key_prefix and filename (no full URLs).
s3:
    endpoint_url: "https://s3.garage.ccmmf.ncsa.cloud"
    bucket: "carb"
    artifact_02:
        key_prefix: "data_raw"
        filename: "ensembles_data_artifact.tar.gz"
    median_tif:
        key_prefix: "data_raw"
        filename: "ca_biomassfiaald_2016_median.tif"
    stdv_tif:
        key_prefix: "data_raw"
        filename: "ca_biomassfiaald_2016_stdv.tif"
    soil_moisture_tgz:
        key_prefix: "data_raw"
        filename: "moisture_20160101_20160110.tgz"
    example3_input_data_tgz:
        key_prefix: "data/workflows/phase_3"
        filename: "magic_example3_input_data_20260714.tgz"
    era5_ca_nc_tgz:
        key_prefix: "data_raw"
        filename: "ERA5_CA_nc_2016_2024.tgz"
    parcels_gpkg:
        key_prefix: "management/crops/v4.1"
        filename: "parcels-consolidated.gpkg"
    crops_all_years_parq:
        key_prefix: "management/crops/v4.1"
        filename: "crops_all_years.parq"
    management_events:
        # Synced (not cp'd) directly into paths.management_raw_dir; excludes
        # mslsp/ (unused) and crops/ (covered by parcels_gpkg/crops_all_years_parq above).
        key_prefix: "management"

# Dispatch options for run-ensembles. The user config selects one by name via pecan_dispatch.
# host_xml is the complete <host>...</host> block to inject into the staged template.xml
# before step 03 (xml_build.R) runs. Valid values for pecan_dispatch in user config are the
# keys listed here.
pecan_dispatch:
    local-gnu-parallel:
        description: "Run ensemble members locally using GNU parallel (no Slurm required)"
        host_xml: |
            <host>
             <name>localhost</name>
             <outdir>output/out</outdir>
             <rundir>output/run</rundir>
             <prerun>@BINARY@ --version</prerun>
             <qstat>squeue -j @JOBID@ || echo DONE</qstat>
             <modellauncher>
              <binary>parallel --will-cite -j @NCPUS@ --skip-first-line '@SIF@ {}/job.sh' ::::</binary>
              <Njobmax>1000</Njobmax>
             </modellauncher>
            </host>
    slurm-dispatch:
        description: "Submit ensemble members to Slurm via sbatch"
        host_xml: |
            <host>
             <name>localhost</name>
             <outdir>output/out</outdir>
             <rundir>output/run</rundir>
             <prerun>@BINARY@ --version</prerun>
             <qsub>sbatch -J @NAME@ -o @STDOUT@ -e @STDERR@ @PARTITION@ @SIF@</qsub>
             <qsub.jobid>Submitted batch job ([0-9]+)</qsub.jobid>
             <qstat>if test -z "$(squeue -h -j @JOBID@)"; then echo "DONE"; fi</qstat>
            </host>

# SIPNET model XML block injected into template.xml during prepare.
# model_xml is used for host-native runs (@SIPNET_BINARY@ is resolved by
# patch_xml_block to the absolute path of the symlink ensure_sipnet_binary
# creates at <run_dir>/sipnet.git).
# model_xml_apptainer is used when use_apptainer=true (binary path is inside container).
sipnet_model:
    model_binary: <binary>@SIPNET_BINARY@</binary>

# SIPNET installation paths for host-native runs (use_apptainer: false).
# src_dir and bin_dir are relative to the repo root.
# revision: empty string = use HEAD; set to a commit SHA or tag to pin a version.
sipnet_install:
    src_dir: "tools/sipnet_src"
    bin_dir: "tools/sipnet_binaries"
    revision: "v2.1.0"

# Apptainer (not in user config)
apptainer:
    remote:
        url: "docker://hdpriest0uiuc/"
    container:
        name: "sipnet-carb"
    tag: "develop"
    sif: "sipnet-carb_develop.sif"
    sipnet_binary: "/usr/local/bin/sipnet.git"
