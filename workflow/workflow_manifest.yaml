          params: {}
          outputs:
              data_dir: data_dir
              ic_outdir: ic_outdir
              site_sipnet_met_path: site_sipnet_met_path
              management_raw_dir: management_raw_dir

    prepare:
        - name: stage-inputs
          script: "workflow/00_stage_external_inputs.sh"
          r_libraries: []
          inputs: {}
          params: {}
          outputs: {}

        - name: convert-clim
          script: "workflow/01_ERA5_nc_to_clim.R"
          r_libraries: [future, furrr]
          inputs:
              site_era5_path: site_era5_path
              site_info_file: site_info_file
          params:
              start_date: start_date
              end_date: end_date
              n_cores: n_workers
              parallel_strategy: parallel_strategy
          outputs:
              site_sipnet_met_path: site_sipnet_met_path

        - name: build-ic
          script: "workflow/02_ic_build.R"
          r_libraries: [tidyverse]
          inputs:
              site_info_path: site_info_file
              field_shape_path: field_shape_path
              pft_dir: pft_dir
              data_dir: data_dir
              landtrendr_raw_files: landtrendr_raw_files
          params:
              ic_ensemble_size: ic_ensemble_size
              run_start_date: start_date
              run_LAI_date: run_LAI_date
              params_read_from_pft: params_read_from_pft
              additional_params: additional_params
          outputs:
              ic_outdir: ic_outdir
              data_dir: data_dir

        - name: build-xml
          script: "workflow/03_xml_build.R"
          r_libraries: [PEcAn.settings]
          inputs:
              site_file: site_info_file
              template_file: template_file
              ic_dir: ic_dir
              met_dir: met_dir
          params:
              n_ens: n_ens
              n_met: n_met
