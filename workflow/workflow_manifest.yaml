# Workflow manifest: fixed paths and step I/O (internal, not user-facing).
# CLI loads this automatically; do not pass via --config.
#
# Paths: All entries under 'paths' are inside the run directory (no paths outside run_dir).
# Keys are referenced by name in steps (inputs/outputs). At runtime the CLI resolves
# each path as run_dir + "/" + value. These are fixed, non-overrideable locations;
# user configs may only supply external source files that are copied into these
# paths before 'prepare' runs.
#
# Steps: Each command has a list of step objects. Each step has:
#   name:        Short identifier for this step
#   script:      Script path (relative to repo root)
#   r_libraries: R packages to check before running this script
#   inputs:      Dict of {cli_flag: path_key} for path-valued flags this script reads
#   outputs:     Dict of {cli_flag: path_key} for path-valued flags this script
#                creates or writes
#   params:      Dict of {cli_flag: value_key} for scalar/list flags this script
#                needs; value_key is resolved via get_val (config override,
#                falling back to the manifest's own top-level value)
#
# cli_flag is the literal "--<cli_flag>" passed on the command line; path_key/
# value_key name where the actual value comes from (a 'paths' entry, or a
# top-level manifest/config scalar). They're often the same string, but not
# always — e.g. build-ic's --site_info_path flag is fed from the site_info_file
# path (one file, one canonical path key, no need to duplicate paths just to
# satisfy a script's flag name), and --run_start_date is fed from start_date.

# Steps per command: script path, R libs to check (empty for shell scripts), input/output/param flag maps
steps:
    get-demo-data:
        - name: get-demo-data
          script: "workflow/00_fetch_s3_and_prepare_run_dir.sh"
          r_libraries: []
